version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
        - "8080:8080"
        - "4210:4210/udp"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
        - "5173:80"
    depends_on:
        - backend
    restart: unless-stopped